name: build-dropbear-armv7

# Cross-compiles a fully static Dropbear for this TV's CPU/userland:
#   - armv7l, EABI soft-float (device linker is ld-linux.so.3, not -armhf)
#   - static link, so the TV's glibc 2.18 version is irrelevant
# Produces a single `dropbearmulti` binary (server + dropbearkey + dbclient + scp)
# uploaded as a build artifact. See README.md for why SSH (not telnet) is needed.

on:
  push:
    paths:
      - ".github/workflows/build-dropbear.yml"
  workflow_dispatch:
    inputs:
      dropbear_tag:
        description: "Dropbear git tag to build"
        default: "DROPBEAR_2022.83"

env:
  DROPBEAR_TAG: ${{ github.event.inputs.dropbear_tag || 'DROPBEAR_2022.83' }}
  # musl soft-float ARM: a glibc static binary hits a _dl_call_libc_early_init
  # crash on the TV's old kernel; musl static binaries are truly standalone.
  CROSS: arm-linux-musleabi

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch musl soft-float ARM cross toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake file
          # Soft-float (musleabi, not musleabihf) to match the TV's ld-linux.so.3.
          for url in \
            "https://musl.cc/${CROSS}-cross.tgz" \
            "https://more.musl.cc/11/x86_64-linux-musl/${CROSS}-cross.tgz"; do
            echo "trying $url"; wget -q -O tc.tgz "$url" && break
          done
          test -s tc.tgz
          tar xzf tc.tgz
          echo "$PWD/${CROSS}-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch Dropbear source at pinned tag
        run: |
          git clone --depth 1 --branch "$DROPBEAR_TAG" https://github.com/mkj/dropbear.git
          cd dropbear
          git rev-parse HEAD

      - name: Pubkey-only options (no password auth -> no crypt() dependency)
        working-directory: dropbear
        run: |
          cat > localoptions.h <<'EOF'
          /* Pubkey-only: password auth needs crypt(), and pubkey auth is the
             right choice for an internet-facing TV. */
          #define DROPBEAR_SVR_PASSWORD_AUTH 0
          #define DROPBEAR_SVR_PUBKEY_AUTH 1
          #define DROPBEAR_CLI_PASSWORD_AUTH 0
          EOF

      - name: Configure (musl static, no zlib, no utmp/wtmp)
        working-directory: dropbear
        run: |
          autoconf && autoheader
          ./configure --host=${CROSS} \
            CC=${CROSS}-gcc \
            CFLAGS="-Os" \
            --disable-zlib \
            --disable-lastlog --disable-utmp --disable-utmpx \
            --disable-wtmp --disable-wtmpx --disable-pututline --disable-pututxline

      - name: Build static dropbearmulti
        working-directory: dropbear
        run: |
          make -j"$(nproc)" PROGRAMS="dropbear dropbearkey dbclient scp" \
            MULTI=1 STATIC=1 LDFLAGS="-static"
          ${CROSS}-strip dropbearmulti

      - name: Test — static, non-PIE, ARM EABI5 soft-float (what the TV needs)
        working-directory: dropbear
        run: |
          file dropbearmulti
          file dropbearmulti | grep -q "ARM"             || { echo "FAIL: not ARM"; exit 1; }
          file dropbearmulti | grep -q "statically linked" || { echo "FAIL: not static"; exit 1; }
          file dropbearmulti | grep -q "ELF 32-bit LSB executable" || { echo "FAIL: not a plain (non-PIE) executable"; exit 1; }
          if file dropbearmulti | grep -qiE "pie executable|shared object"; then
            echo "FAIL: PIE build crashes on the TV's kernel"; exit 1; fi
          # Soft-float ABI: TV userland is ld-linux.so.3 (gnueabi), not -armhf.
          # A hard-float binary would carry Tag_ABI_VFP_args: VFP registers.
          if ${CROSS}-readelf -A dropbearmulti | grep -qi "Tag_ABI_VFP_args"; then
            echo "FAIL: hard-float ABI, TV is soft-float"; exit 1; fi
          echo "OK: static non-PIE ARM EABI5 soft-float"

      - name: Test — runs under QEMU and does what we need on the TV
        working-directory: dropbear
        run: |
          sudo apt-get install -y qemu-user-static
          # These would all have caught the PIE/dynamic-link crash before deploy.
          echo "== ed25519 host key generation =="
          qemu-arm-static ./dropbearmulti dropbearkey -t ed25519 -f /tmp/hk_ed25519
          test -s /tmp/hk_ed25519 || { echo "FAIL: no ed25519 key"; exit 1; }
          echo "== rsa host key generation =="
          qemu-arm-static ./dropbearmulti dropbearkey -t rsa -s 2048 -f /tmp/hk_rsa
          test -s /tmp/hk_rsa || { echo "FAIL: no rsa key"; exit 1; }
          echo "== server binary parses options / prints usage =="
          qemu-arm-static ./dropbearmulti dropbear -h 2>&1 | grep -qi "dropbear" \
            || { echo "FAIL: dropbear server did not run"; exit 1; }
          echo "== client binary runs =="
          qemu-arm-static ./dropbearmulti dbclient 2>&1 | grep -qi "usage\|dbclient\|dropbear" \
            || { echo "FAIL: dbclient did not run"; exit 1; }
          echo "ALL TV SMOKE TESTS PASSED"
          ls -l dropbearmulti

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbearmulti-armv7-static
          path: dropbear/dropbearmulti
          if-no-files-found: error
