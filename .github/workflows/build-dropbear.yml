name: build-dropbear-armv7

# Cross-compiles a fully static Dropbear for this TV's CPU/userland:
#   - armv7l, EABI soft-float (device linker is ld-linux.so.3, not -armhf)
#   - static link, so the TV's glibc 2.18 version is irrelevant
# Produces a single `dropbearmulti` binary (server + dropbearkey + dbclient + scp)
# uploaded as a build artifact. See README.md for why SSH (not telnet) is needed.

on:
  push:
    paths:
      - ".github/workflows/build-dropbear.yml"
  workflow_dispatch:
    inputs:
      dropbear_tag:
        description: "Dropbear git tag to build"
        default: "DROPBEAR_2022.83"

env:
  DROPBEAR_TAG: ${{ github.event.inputs.dropbear_tag || 'DROPBEAR_2022.83' }}
  CROSS: arm-linux-gnueabi

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install soft-float ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi autoconf automake file

      - name: Fetch Dropbear source at pinned tag
        run: |
          git clone --depth 1 --branch "$DROPBEAR_TAG" https://github.com/mkj/dropbear.git
          cd dropbear
          git rev-parse HEAD

      - name: Pubkey-only options (no password auth -> no crypt() dependency)
        working-directory: dropbear
        run: |
          cat > localoptions.h <<'EOF'
          /* Pubkey-only: password auth needs crypt(), which modern glibc drops,
             and pubkey auth is the right choice for an internet-facing TV. */
          #define DROPBEAR_SVR_PASSWORD_AUTH 0
          #define DROPBEAR_SVR_PUBKEY_AUTH 1
          #define DROPBEAR_CLI_PASSWORD_AUTH 0
          EOF

      - name: Configure (static, non-PIE, no zlib, no utmp/wtmp)
        working-directory: dropbear
        run: |
          # -no-pie is essential: Ubuntu gcc defaults to static-PIE, which
          # crashes on this TV's old kernel/glibc with a _dl_call_libc_early_init
          # assertion. A classic (non-PIE) static ELF runs fine.
          autoconf && autoheader
          ./configure --host=${CROSS} \
            CC=${CROSS}-gcc \
            CFLAGS="-Os -fno-pie" \
            LDFLAGS="-no-pie" \
            --disable-zlib \
            --disable-lastlog --disable-utmp --disable-utmpx \
            --disable-wtmp --disable-wtmpx --disable-pututline --disable-pututxline

      - name: Build static dropbearmulti
        working-directory: dropbear
        run: |
          make -j"$(nproc)" PROGRAMS="dropbear dropbearkey dbclient scp" \
            MULTI=1 STATIC=1
          ${CROSS}-strip dropbearmulti

      - name: Verify it is a NON-PIE static ARM EABI binary
        working-directory: dropbear
        run: |
          file dropbearmulti
          file dropbearmulti | grep -q "ARM" || { echo "not ARM"; exit 1; }
          file dropbearmulti | grep -q "statically linked" || { echo "not static"; exit 1; }
          # must NOT be a PIE/shared object (that's the crash cause)
          if file dropbearmulti | grep -qiE "pie executable|shared object"; then
            echo "ERROR: built as PIE, will crash on target"; exit 1; fi
          file dropbearmulti | grep -q "ELF 32-bit LSB executable" || { echo "not a plain executable"; exit 1; }
          ls -l dropbearmulti

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbearmulti-armv7-static
          path: dropbear/dropbearmulti
          if-no-files-found: error
